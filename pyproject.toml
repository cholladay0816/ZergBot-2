[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zergbot2"
version = "0.2.0"
description = "Tag-persistent autonomous StarCraft II unit agents"
requires-python = ">=3.14,<3.15"
dependencies = ["burnysc2==7.3.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "build==1.6.1"]

[project.scripts]
zergbot2 = "zergbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
